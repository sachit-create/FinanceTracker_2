{% extends "base.html" %} {% block title %} AddTrac Page {% endblock %} {% block
content %}
<main class="w-full h-screen flex flex-col items-center gap-10">
  <h1 class="mt-5 text-4xl bg-white p-5 rounded-lg">Add Transactions</h1>
  <form
    action="/addtrac"
    method="POST"
    class="h-120 w-100 border-2 rounded-2xl"
  >
    <input type="text" name="amount" placeholder="Amount : " required/>
    <input type="text" name="description" placeholder="Description : " required/>
    <select name="type" required>
      <option value="credit">Credit</option>
      <option value="debit">Debit</option>
    </select>
    <input type="submit"/>
  </form>
</main>
{% endblock %}
