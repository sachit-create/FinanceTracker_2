{% extends "base.html" %}

{% block title %}Add Transaction{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Add transaction</h2>
    <p class="auth-subtitle">Record income or expense</p>

    <form method="POST" class="form-grid">
      <input class="form-field" type="number" name="amount" step="0.01" min="0.01" placeholder="Amount" required>
      <input class="form-field" type="text" name="description" placeholder="Description" required>
      <select class="form-field" name="type" required>
        <option value="credit">Credit (Income)</option>
        <option value="debit">Debit (Expense)</option>
      </select>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save transaction</button>
      </div>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('home') }}">Back to dashboard</a>
    </p>
  </div>
</div>
{% endblock %}
