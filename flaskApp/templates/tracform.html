{% extends "base.html" %} {% block title %} AddTrac Page {% endblock %} {% block
content %}
<main class="w-full h-screen flex flex-col items-center gap-10">
  <h1 class="mt-5 text-4xl bg-white p-5 rounded-lg">Add Transactions</h1>
  <form
    action="/addtrac"
    method="POST"
    class="h-120 w-100 border-2 rounded-2xl flex flex-col items-center justify-around"
  >
    <input
      type="text"
      name="amount"
      placeholder="Amount : "
      required
      class="bg-white outline-none h-15 w-80 text-black pl-4 text-3xl rounded-2xl"
    />
    <input
      type="text"
      name="description"
      placeholder="Description : "
      required
      class="bg-white outline-none h-15 w-80 text-black pl-4 text-3xl rounded-2xl"
    />
    <select
      name="type"
      required
      class="bg-white outline-none h-15 w-80 text-black pl-4 text-3xl rounded-2xl"
    >
      <option value="credit"
        class="bg-green-600"
      >Credit</option>
      <option value="debit"
        class="bg-red-600"
      >Debit</option>
    </select>
    <input type="submit" class="bg-black text-white
    h-12 w-40 rounded-xl border-3 transition-colors duration-200 border-white hover:border-blue-700 focus:border-pink-500"/>
  </form>
</main>
{% endblock %}
